[project]
name = "decision-eval"
version = "0.1.0"
description = "Benchmark zero-shot decision models (choice / yes-no / score) on identical requests: accuracy, calibration, latency and cost, suite by suite."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
# Each backend is an extra, so `uv run --extra jev` never pulls torch.
laya = ["laya==0.3.10"]  # pinned: the published results were produced with 0.3.10
gliner = ["onnxruntime>=1.20", "tokenizers>=0.20", "huggingface-hub>=0.25"]
jev = []  # stdlib HTTP only; needs OPENROUTER_API_KEY
figures = ["matplotlib>=3.9"]

[project.scripts]
decision-eval = "decision_eval.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"  # pytest-xdist: one worker per CPU; pass -n 0 to run serially

[tool.hatch.build.targets.wheel]
packages = ["src/decision_eval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
